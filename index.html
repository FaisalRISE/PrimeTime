<style>
:root{--r:13px}
html[data-theme="dark"]{
  --bg:#110d1c; --surface:#181226; --card:#201833; --cardAlt:#2a2042;
  --border:#352a52; --borderL:#4a3d6e;
  --text:#f4eeff; --muted:#a99ec8; --dim:#857aa6;
  --accent:#ffd166; --accentD:#e0a92e; --onAccent:#221a34;
  --mint:#06d6a0; --gold:#fbbf24; --win:#5eead4; --loss:#fb7185; --cyan:#2dd4bf; --violet:#a78bfa;
  --accentInk:#ffe29a; --goldInk:#fcd34d; --lossInk:#fda4af; --mintInk:#5eead4; --violetInk:#c4b5fd; --cyanInk:#5eead4;
  --glow1:rgba(6,214,160,.07); --glow2:rgba(255,209,102,.06);
  --court:#1d4f7a; --courtDeep:#17608a; --courtLine:#f4f8fb; --kitchen:#c2632f;
}
html[data-theme="light"]{
  --bg:#f6f7fb; --surface:#eef1f7; --card:#ffffff; --cardAlt:#f1f4fa;
  --border:#dbe1ec; --borderL:#c3ccdc;
  --text:#111827; --muted:#414b58; --dim:#5b6372;
  --accent:#d98e04; --accentD:#b45309; --onAccent:#ffffff;
  --mint:#0a9c77; --gold:#b45309; --win:#047857; --loss:#be123c; --cyan:#0f766e; --violet:#6d28d9;
  --accentInk:#7c4a02; --goldInk:#7c4a02; --lossInk:#9f1239; --mintInk:#04674f; --violetInk:#4c1d95; --cyanInk:#0f5f59;
  --glow1:rgba(10,156,119,.05); --glow2:rgba(217,142,4,.05);
  --court:#2f6b93; --courtDeep:#27597c; --courtLine:#ffffff; --kitchen:#b45f31;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body.reflock{overflow:hidden}
body{background:radial-gradient(1100px 550px at 85% -10%,var(--glow1),transparent 60%),
  radial-gradient(900px 500px at -10% 5%,var(--glow2),transparent 55%),var(--bg);
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:74px;font-variant-numeric:tabular-nums}
.display,.anton{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:25px;margin:0;line-height:1.1;text-transform:uppercase}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto}
nav button{flex:1;min-width:66px;background:none;border:0;color:var(--dim);padding:11px 5px 12px;font:600 11.5px 'Outfit';cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--accentInk);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.hd{font:700 11px 'Outfit';letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:11px 11px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hd b{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.hidden{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--cardAlt);border:1px solid var(--borderL);color:var(--text);padding:9px 14px;border-radius:9px;font:600 13px 'Outfit';cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.dgr{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

.net{background:repeating-linear-gradient(180deg,#f8fafc 0 4px,#94a3b8 4px 8px)}

.half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}

.half.b .cbox{padding-left:calc(20% + 10px)}

.cbox.locked{cursor:default}.cbox.locked:hover{background:transparent}

.servetag{font:800 8.5px 'Outfit';letter-spacing:.06em;text-transform:uppercase;color:#fde047;margin-top:2px}

  return DEFAULT_TEAMS.map(t=>({id:t.id, code:t.code, name:t.name, hex:t.hex, ink:t.ink,
    players:t.p.map((n,i)=>({id:t.id+'_'+i, name:n, pool:POOLS[i]}))}));
}
function newMatch(id,extra){
  return Object.assign({id, a:null, b:null, c:0, lineup:{}, flip:{}, log:[], fs:null,
    server:'a', startLeft:null, acked:[], endsAcked:false}, extra||{});
}
function buildMatches(){
  const out=[]; let n=1;
  SCHEDULE.forEach((round,ri)=>round.forEach((pr,ci)=>{
    out.push(newMatch('m'+(n++),{stage:'league', round:ri+1, c:ci, a:'t'+pr[0], b:'t'+pr[1]}));
  }));
  out.push(newMatch('mB',{stage:'bronze', round:ROUNDS+1, c:1}));
  out.push(newMatch('mF',{stage:'final',  round:ROUNDS+1, c:0}));
  return out;
}

           gate:Math.min(60,Math.max(3,int(r.gate,15))),
           switchAt:Math.min(150,Math.max(0,int(r.switchAt,25))) };
}

const tcol=t=>t?(S.theme==='light'?t.ink:t.hex):'var(--dim)';
const captainOf=t=>t&&t.players[0]?t.players[0].name:'';

const pName=id=>{const p=playerById(id);return p?(p.name||'—'):'—';};

const courtName=i=>S.courts[i]||('Court '+(i+1));
const LEAGUE=()=>S.matches.filter(m=>m.stage==='league');
function matchTitle(m){
  if(m.stage==='final') return 'Final';
  if(m.stage==='bronze') return 'Bronze medal match';
  return 'Round '+m.round;
}
const matchWhere=m=>matchTitle(m)+' · '+courtName(m.c);

const hasLog=m=>!!(m.log&&m.log.length);
const typedBoth=m=>!!(m.fs&&m.fs.a!=null&&m.fs.b!=null);
function scoreOf(m){
  if(hasLog(m)){ let a=0,b=0; m.log.forEach(x=>{ if(x==='a')a++; else b++; }); return {a,b,c:a+b}; }
  const a=m.fs&&m.fs.a!=null?m.fs.a:0, b=m.fs&&m.fs.b!=null?m.fs.b:0; return {a,b,c:a+b};
}
const counts=m=>hasLog(m)||typedBoth(m);
const started=m=>hasLog(m)||!!(m.fs&&(m.fs.a!=null||m.fs.b!=null));
function winnerOf(m){
  if(!m.a||!m.b||!counts(m)) return null;
  const s=scoreOf(m);
  if((s.a>=TARGET||s.b>=TARGET)&&s.a!==s.b) return s.a>s.b?m.a:m.b;
  return null;
}
const isOver=m=>winnerOf(m)!==null;
const isLive=m=>hasLog(m)&&!isOver(m);
/* a typed score that is not a finished game — 51 must be on one side */
function oddScore(m){
  if(hasLog(m)||!typedBoth(m)) return false;
  const s=scoreOf(m);
  return !isOver(m) || s.a>TARGET || s.b>TARGET;
}
const lineupReady=m=>!!(m.a&&m.b&&m.lineup&&m.lineup[m.a]&&m.lineup[m.b]
  &&m.lineup[m.a].length===SQUAD&&m.lineup[m.b].length===SQUAD
  &&m.lineup[m.a].every(Boolean)&&m.lineup[m.b].every(Boolean));

/* ---------- rotation: the combined score is the clock ----------
   0–15 A1+A2, 16–30 A2+A3 … 76–90 A6+A1, then round again from 91. */
const curSeg=c=>Math.floor(c/GATE);                       // segment the next rally belongs to
const pairIdx=c=>{const s=curSeg(c)%SQUAD;return [s,(s+1)%SQUAD];};
const nextGateAt=c=>(Math.floor(c/GATE)+1)*GATE;
const pairLabel=c=>pairIdx(c).map(i=>'A'+(i+1)).join(' + ');
/* Court positions and the serve, rebuilt from the rally log every time.
   Rally scoring: the server serves from the RIGHT when their team's score is
   even, LEFT when odd. The serving team winning the rally swaps its two players
   and the same player serves on; the receiving team winning takes the serve
   with nobody moving. At each gate the player leaving is replaced in the very
   box they stood in. */
function courtState(m){
  const fa=!!(m.flip&&m.flip[m.a]), fb=!!(m.flip&&m.flip[m.b]);
  const slot={}; slot[m.a]={R:fa?1:0,L:fa?0:1}; slot[m.b]={R:fb?1:0,L:fb?0:1};
  let serving=m.server||'a'; const score={a:0,b:0}; let lastSub=null;
  (m.log||[]).forEach(w=>{
    const tid=(w==='a')?m.a:m.b, wasServing=(serving===w);
    score[w]++;
    if(wasServing){ const s=slot[tid],t=s.R; s.R=s.L; s.L=t; } else serving=w;
    const c=score.a+score.b;
    if(c%GATE===0){
      const seg=c/GATE, leave=((seg-1)%SQUAD+SQUAD)%SQUAD, enter=(seg+1)%SQUAD;
      [m.a,m.b].forEach(t2=>{ const s2=slot[t2]; if(s2.R===leave)s2.R=enter; else if(s2.L===leave)s2.L=enter; });
      lastSub={at:c,leave,enter};
    }
  });
  return {slot,serving,score,lastSub};
}
const servingBox=(cs,key)=>(cs.score[key]%2===0)?'R':'L';
function replayMatch(m,cb){
  if(!lineupReady(m)||!hasLog(m)) return;
  const fa=!!(m.flip&&m.flip[m.a]), fb=!!(m.flip&&m.flip[m.b]);
  const slot={}; slot[m.a]={R:fa?1:0,L:fa?0:1}; slot[m.b]={R:fb?1:0,L:fb?0:1};
  let serving=m.server||'a'; const score={a:0,b:0};
  m.log.forEach(w=>{
    const key=serving, servTid=(key==='a')?m.a:m.b;
    const serverIdx=slot[servTid][(score[key]%2===0)?'R':'L'];
    const onCourt={}; [m.a,m.b].forEach(t=>{onCourt[t]=[m.lineup[t][slot[t].R],m.lineup[t][slot[t].L]];});
    cb({w,servingKey:key,serverPid:m.lineup[servTid][serverIdx],onCourt,lead:Math.max(score.a,score.b)});
    const tid=(w==='a')?m.a:m.b, wasServing=(serving===w);
    score[w]++;
    if(wasServing){const s2=slot[tid],t2=s2.R;s2.R=s2.L;s2.L=t2;} else serving=w;
    const c=score.a+score.b;
    if(c%GATE===0){const seg=c/GATE,leave=((seg-1)%SQUAD+SQUAD)%SQUAD,enter=(seg+1)%SQUAD;
      [m.a,m.b].forEach(t=>{const s3=slot[t];if(s3.R===leave)s3.R=enter;else if(s3.L===leave)s3.L=enter;});}
  });
}
function subPending(m){
  if(!lineupReady(m)||isOver(m)||!hasLog(m)) return null;
  const c=scoreOf(m).c;
  if(c===0||c%GATE!==0) return null;
  return ((m.acked||[]).indexOf(c)>=0)?null:c;
}
function endsPending(m){
  if(!SWITCH_AT||!lineupReady(m)||isOver(m)||!hasLog(m)) return false;
  const s=scoreOf(m); return Math.max(s.a,s.b)>=SWITCH_AT && !m.endsAcked;
}
function pruneAcks(m){
  const s=scoreOf(m);
  m.acked=(m.acked||[]).filter(g=>g<=s.c);
  if(!SWITCH_AT||Math.max(s.a,s.b)<SWITCH_AT) m.endsAcked=false;
}

/* ---------- stats from the rally logs ---------- */
const CLUTCH_FROM=40;
function rallyStats(){
  const P={},PR={};
  S.teams.forEach(t=>t.players.forEach(p=>{P[p.id]={p,team:t,won:0,lost:0,serves:0,servePts:0,cw:0,cl:0,matches:{}};}));
  let withLineups=0,total=0;
  S.matches.forEach(m=>{
    if(!m.a||!m.b||!hasLog(m)) return;
    total++; if(!lineupReady(m)) return; withLineups++;
    replayMatch(m,ev=>{
      const winTid=(ev.w==='a')?m.a:m.b, loseTid=(ev.w==='a')?m.b:m.a, clutch=ev.lead>=CLUTCH_FROM;
      ev.onCourt[winTid].forEach(pid=>{const r=P[pid];if(!r)return;r.won++;r.matches[m.id]=1;if(clutch)r.cw++;});
      ev.onCourt[loseTid].forEach(pid=>{const r=P[pid];if(!r)return;r.lost++;r.matches[m.id]=1;if(clutch)r.cl++;});
      const sv=P[ev.serverPid];
      if(sv){ sv.serves++; if((ev.servingKey==='a'?m.a:m.b)===winTid) sv.servePts++; }
      [[winTid,true],[loseTid,false]].forEach(x=>{
        const ids=ev.onCourt[x[0]].slice().sort(), k=ids.join('|');
        if(!PR[k]) PR[k]={ids,team:teamById(x[0]),won:0,lost:0};
        x[1]?PR[k].won++:PR[k].lost++;
      });
    });
  });
  const fin=o=>{o.rallies=o.won+o.lost;o.diff=o.won-o.lost;o.rate=o.rallies?Math.round(o.won/o.rallies*1000)/10:0;return o;};
  const players=Object.keys(P).map(k=>fin(P[k])).filter(o=>o.rallies>0).map(o=>{
    o.played=Object.keys(o.matches).length; o.hold=o.serves?Math.round(o.servePts/o.serves*1000)/10:0;
    o.cdiff=o.cw-o.cl; return o; });
  return {players, pairs:Object.keys(PR).map(k=>fin(PR[k])), withLineups, total};
}

/* ===================== standings and the finals ===================== */
function h2h(x,y){
  const m=LEAGUE().find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x));
  if(!m) return 0; const w=winnerOf(m); return w===x?1:w===y?-1:0;
}
/* One table of all ten teams. Ranked on points scored across the four
   matches, then point difference, then wins, then head-to-head if they met. */
function standings(){
  const acc={}; S.teams.forEach((t,i)=>{acc[t.id]={team:t,ix:i,p:0,w:0,l:0,pf:0,pa:0};});
  LEAGUE().forEach(m=>{
    if(!m.a||!m.b||!acc[m.a]||!acc[m.b]||!counts(m)) return;
    const s=scoreOf(m), win=winnerOf(m);
    acc[m.a].pf+=s.a; acc[m.a].pa+=s.b; acc[m.b].pf+=s.b; acc[m.b].pa+=s.a;
    if(win){ acc[m.a].p++; acc[m.b].p++;
      if(win===m.a){acc[m.a].w++;acc[m.b].l++;} else {acc[m.b].w++;acc[m.a].l++;} }
  });
  const list=Object.values(acc); list.forEach(r=>r.diff=r.pf-r.pa);
  list.sort((p,q)=>(q.pf-p.pf)||(q.diff-p.diff)||(q.w-p.w)||h2h(q.team.id,p.team.id)||(p.ix-q.ix));
  list.forEach((r,i)=>r.rank=i+1);
  return list;
}
const leaguePlayed=()=>LEAGUE().filter(isOver).length;
const leagueDone=()=>LEAGUE().every(isOver);
function setPair(m,a,b){ if(m.a===a&&m.b===b) return;
  m.a=a; m.b=b; m.lineup={}; m.flip={}; m.log=[]; m.fs=null; m.acked=[]; m.endsAcked=false; m.startLeft=null; m.server='a'; }
function syncFinals(){
  const F=matchById('mF'), B=matchById('mB'); if(!F||!B) return;
  F.c=Math.min(S.courts.length-1,Math.max(0,S.finC|0)); B.c=Math.min(S.courts.length-1,Math.max(0,S.broC|0));
  if(!leagueDone()){ if(!started(F)) setPair(F,null,null); if(!started(B)) setPair(B,null,null); return; }
  const r=standings();
  if(!started(F)) setPair(F,r[0].team.id,r[1].team.id);
  if(!started(B)) setPair(B,r[2].team.id,r[3].team.id);
}
function refresh(){ applyRules(); syncFinals(); }
function champions(){
  const F=matchById('mF'), B=matchById('mB'), out={};
  if(F&&isOver(F)){ out.gold=teamById(winnerOf(F)); out.silver=teamById(winnerOf(F)===F.a?F.b:F.a); }
  if(B&&isOver(B)) out.bronze=teamById(winnerOf(B));
  return out;
}
/* the match each court should be playing now: the first one not yet finished */
function courtQueue(ci){
  return S.matches.filter(m=>m.c===ci && (m.stage==='league' || (m.a&&m.b)))
    .sort((x,y)=>x.round-y.round);
}
const nowOn=ci=>courtQueue(ci).find(m=>m.a&&m.b&&!isOver(m))||null;

const isAdmin=()=>S.role==='admin', isOrganiser=()=>S.role==='organiser';
const canScore=()=>S.role==='admin'||S.role==='organiser'||S.role==='scorer';

async function hashPin(p){
  const salted='ptme2|'+(sync.event||'')+'|'+p;
  try{ if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salted));
    return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; for(let i=0;i<salted.length;i++){ h=((h*33)^salted.charCodeAt(i))>>>0; } return 'x'+h.toString(16);
}
async function adminMatches(v){ const h=await hashPin(v); return S.adminHash?h===S.adminHash:h===await hashPin(ADMIN_DEFAULT); }
const scorerPinSet=()=>!!S.scorerHash, orgPinSet=()=>!!S.orgHash;
function openAccess(){ openModal(accessModal()); }
function accessModal(err){
  if(S.role!=='view') return signedInModal();
  return `<h3>Unlock this device</h3>
    <p class="hint">Enter your PIN — referee or organiser — or the admin password.</p>
    ${err?`<div class="alert bad" style="margin-top:10px"><span>⚠</span><span>${esc(err)}</span></div>`:''}
    <label class="fl">PIN or password</label>
    <input type="password" id="accIn" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryAccess()">
    <div class="row" style="margin-top:16px">
      <button class="btn acc" style="flex:1" onclick="tryAccess()">Unlock</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>
    <div class="alert ok" style="margin-top:14px"><span>ℹ</span><span>
      <b>Referee</b> declares line-ups, runs the court console and enters scores.<br>
      <b>Organiser</b> also edits teams, prints and shares results.<br>
      <b>Admin</b> also sets up the event, the passwords and who sees what.</span></div>`;
}
async function tryAccess(){
  const v=document.getElementById('accIn').value; if(!v) return;
  if(await adminMatches(v)){ S.role='admin'; if(!S.adminHash) S.adminHash=await hashPin(v);
    save(); closeModal(); render(); toast('Admin mode — full control'); if(sync.on) drainQueue(6); return; }
  const h=await hashPin(v);
  if(orgPinSet()&&h===S.orgHash){ S.role='organiser'; save(); closeModal(); render(); toast('Organiser mode'); return; }
  if(scorerPinSet()&&h===S.scorerHash){ S.role='scorer'; save(); closeModal(); render(); toast('Referee mode'); return; }
  openModal(accessModal(scorerPinSet()||orgPinSet()?'That PIN or password is not right.':'No PINs have been set yet. Use the admin password.'));
}

  if(isOrganiser()) return 'This device can declare line-ups and enter scores'+(canEditTeams()?', edit teams':'')+(canExport()?', print':'')+(canShare()?', share images and WhatsApp summaries':'')+'.';
  return 'This device can declare line-ups, run the court console and enter scores.';
}
function pinBlock(kind){
  const org=kind==='org', set=org?orgPinSet():scorerPinSet(), nm=org?'Organiser':'Referee';
  return `<div class="eyebrow" style="margin:16px 2px 6px">${nm} PIN</div>
    <div class="alert ${set?'ok':'warn'}"><span>${set?'●':'○'}</span><span>${set?`A ${nm.toLowerCase()} PIN is set.`:`No ${nm.toLowerCase()} PIN yet.`}</span></div>
    <label class="fl">${set?'Replace the '+nm.toLowerCase()+' PIN':'Set a '+nm.toLowerCase()+' PIN'}</label>
    <input type="password" id="${org?'opin':'spin'}" placeholder="At least 4 characters">
    <div class="row" style="margin-top:10px">

}
function signedInModal(){
  return `<h3>${ROLE_LABEL[S.role]} mode</h3><p class="hint">${roleBlurb()}</p>
    ${isAdmin()?`${pinBlock('org')}${pinBlock('ref')}
      <p class="hint">The two PINs must be different. Who sees which tab is set in Setup → Access.</p>
      <div class="eyebrow" style="margin:18px 2px 6px">Admin password</div>
      <label class="fl">Current password</label><input type="password" id="ap0">
      <label class="fl">New password</label><input type="password" id="ap1">
      <label class="fl">Type it again</label><input type="password" id="ap2">

async function setPin(kind){
  if(!isAdmin()) return;
  const org=kind==='org', v=document.getElementById(org?'opin':'spin').value||'';
  if(v.length<4) return toast('Use at least 4 characters');
  const h=await hashPin(v);
  if(h===(org?S.scorerHash:S.orgHash)) return toast('That PIN is already used for the other role');
  if(await adminMatches(v)) return toast('That is the admin password — use a different one');
  if(org) S.orgHash=h; else S.scorerHash=h;
  save(); toast((org?'Organiser':'Referee')+' PIN set'); if(sync.on) drainQueue(6); openModal(signedInModal());
}
function clearPin(kind){
  if(!isAdmin()) return;
  if(!confirm('Remove this PIN? Devices already unlocked stay unlocked.')) return;
  if(kind==='org') S.orgHash=''; else S.scorerHash='';
  save(); toast('PIN removed'); if(sync.on) drainQueue(6); openModal(signedInModal());
}
async function changeAdmin(){
  if(!isAdmin()) return;
  if(!await adminMatches(document.getElementById('ap0').value||'')) return toast('The current password is not right');
  const a=document.getElementById('ap1').value||'', b=document.getElementById('ap2').value||'';
  if(a.length<6) return toast('Use at least 6 characters'); if(a!==b) return toast('The two new passwords do not match');
  S.adminHash=await hashPin(a); save(); toast('Admin password changed'); if(sync.on) drainQueue(6); openModal(signedInModal());
}
function signOut(){ S.role='view'; S.ref=null; S.editTeams=false; save(); closeModal(); closeRef(); render(); toast('This device is view only'); }

function applyDocTitle(){

/* ===================== render ===================== */
function TABS(){
  if(isAdmin()){ const t=TAB_LIST.filter(([k])=>k!=='data'); t.push(['setup','Setup'],['data','Data']); return t; }
  const on=ACCESS().tabs[S.role]||ACCESS().tabs.view;
  const t=TAB_LIST.filter(([k])=>on[k]); return t.length?t:[['matches','Matches']];
}
function render(){
  const keep=grabFocus();
  applyTheme(); refresh(); applyDocTitle();
  if(TABS().map(t=>t[0]).indexOf(S.tab)<0) S.tab=TABS()[0][0];
  quietSave(); if(typeof syncScan==='function') syncScan();
  const views={courts:vLive,matches:vMatches,table:vTable,finals:vFinals,stats:vStats,teams:vTeams,rules:vRules,setup:vSetup,data:vData};
  document.getElementById('wrap').innerHTML=headerHTML()+views[S.tab]()+footerHTML();
  document.getElementById('nav').innerHTML=TABS().map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');

}
function go(t){ S.tab=t; render(); window.scrollTo(0,0); }

    </div></header>

}
function pillsHTML(){

function foldOpen(id,done){ if(S.fold&&S.fold[id]!==undefined) return !!S.fold[id]; return !done; }
function toggleFold(id,done){ S.fold=S.fold||{}; S.fold[id]=!foldOpen(id,done); quietSave(); render(); }
function section(id,title,done,total,bodyFn){
  const complete=total>0&&done>=total, open=foldOpen(id,complete);
  return `<div class="rnd"><button class="secHead ${open?'':'closed'}" onclick="toggleFold('${id}',${complete})">
      <span class="chev">${open?'▾':'▸'}</span><span class="secT">${title}</span>
      <span class="secMeta ${complete?'done':''}">${total?`${done}/${total}${complete?' ✓':''}`:''}</span></button>

}
const teamTag=(t,right)=>t?`<span class="tdot" style="background:${t.hex}"></span><span class="nm">${esc(t.name)}<span class="cp">${esc(captainOf(t))}</span></span>`
  :`<span class="nm" style="color:var(--dim)">To be decided</span>`;

/* ---------- Live: what is on every court right now ---------- */
function vLive(){
  const ch=champions(); let h='';
  if(ch.gold) h+=`<div class="winbanner"><div style="font-size:28px">🏆</div><div class="eyebrow" style="color:var(--accentInk)">Champions</div>
    <div class="wn" style="color:${tcol(ch.gold)}">${esc(ch.gold.name)}</div></div>`;
  const cur=LEAGUE().find(m=>!isOver(m));
  h+=`<p class="note" style="margin:0 0 12px">${cur?`<b>Round ${cur.round}</b> is up. `:leagueDone()?'League finished — the Final and Bronze match are set. ':''}
    Tap a court to follow it live${canScore()?' or to run its console':''}. Rally scoring, first to ${TARGET} · golden point at ${GOLDEN}–${GOLDEN} · substitution every ${GATE} combined points.</p>`;
  h+=`<div class="grid g2 g3">`+S.courts.map((nm,ci)=>{
    const q=courtQueue(ci), m=nowOn(ci), done=q.filter(isOver).length;
    if(!m) return `<div class="card ccard"><div class="ccTop"><span class="ccName">${esc(nm)}</span>
      <span class="ccMeta">${done}/${q.length}</span></div><div class="note">Nothing more scheduled here.</div>
      <div class="prog"><i style="width:${q.length?done/q.length*100:0}%"></i></div></div>`;
    const A=teamById(m.a),B=teamById(m.b),s=scoreOf(m),live=isLive(m);
    let on='';
    if(lineupReady(m)&&live){ const cs=courtState(m);
      const pair=t=>{const sl=cs.slot[t.id], lu=m.lineup[t.id];
        return `<b>${esc(pName(lu[sl.R]))}</b> & <b>${esc(pName(lu[sl.L]))}</b>`;};
      on=`<div class="ccOn">On court (${pairLabel(s.c)}): ${pair(A)} v ${pair(B)}<br>Next substitution at ${nextGateAt(s.c)} combined</div>`;
    } else if(!started(m)) on=`<div class="ccOn">${lineupReady(m)?'Line-ups declared · ready to start':'Waiting for line-ups'}</div>`;
    return `<div class="card ccard ${live?'live':''}" onclick="openRef('${m.id}')">
      <div class="ccTop"><span class="ccName">${esc(nm)}</span>
        <span class="stchip ${live?'st-live':started(m)?'st-done':'st-wait'}">${live?'● Live':started(m)?'Score in':'Up next'} · ${esc(matchTitle(m))}</span></div>
      <div class="ccVs"><div class="ccTeam"><span class="tdot" style="background:${A.hex}"></span>${esc(A.name)}</div>
        <div class="ccSc">${started(m)?s.a+'–'+s.b:'v'}</div>
        <div class="ccTeam r">${esc(B.name)}<span class="tdot" style="background:${B.hex}"></span></div></div>
      ${on}<div class="prog"><i style="width:${q.length?done/q.length*100:0}%"></i></div></div>`;
  }).join('')+`</div>`;
  return h;
}

/* ---------- Matches: every round, typed scores or the console ---------- */
function modeBar(){
  if(!canScore()) return '';
  return `<div class="row" style="margin-bottom:12px;align-items:center">
    <button class="chip ${S.mode==='ref'?'on':''}" onclick="S.mode='ref';quietSave();render()">🏓 Court console</button>
    <button class="chip ${S.mode==='entry'?'on':''}" onclick="S.mode='entry';quietSave();render()">⌨ Type final scores</button>
    <span class="note">${S.mode==='entry'?'For a match not scored live: type the final score. Tab or Enter moves on.'
      :'Tap a match to declare line-ups and score it rally by rally.'}</span></div>`;
}
function oddBanner(){
  if(!canScore()) return '';
  const L=S.matches.filter(m=>m.a&&m.b&&oddScore(m)); if(!L.length) return '';
  return `<div class="alert warn"><span>⚠</span><span><b>${L.length===1?'This score is':'These scores are'} not a finished game</b> — one side must be on ${TARGET}. Check ${L.length===1?'it':'them'}; points still count in the table.
    <ul>${L.map(m=>`<li><b>${esc(matchWhere(m))}</b> · ${esc(teamById(m.a).name)} ${m.fs.a}–${m.fs.b} ${esc(teamById(m.b).name)}</li>`).join('')}</ul></span></div>`;
}
function matchRow(m){
  const A=teamById(m.a),B=teamById(m.b), s=scoreOf(m), win=winnerOf(m), has=!!(A&&B);
  const entry=canScore()&&S.mode==='entry'&&has&&!hasLog(m), odd=oddScore(m);
  const box=(side)=>{
    if(entry){ const v=m.fs&&m.fs[side]!=null?m.fs[side]:'';
      return `<input class="sc ${v!==''?'filled':''} ${odd?'odd':''}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
        maxlength="${String(TARGET).length}" data-k="${m.id}:${side}" value="${v}"
        oninput="scoreInput(this)" onchange="scoreCheck(this)" onfocus="this.select()" onclick="event.stopPropagation()">`; }
    const shown=has&&started(m);
    return `<div class="scv ${win&&win===(side==='a'?m.a:m.b)?'w':''}">${shown?s[side]:'–'}</div>`;
  };
  let btn='';
  if(has&&canScore()&&S.mode==='ref') btn=`<button class="refbtn ${isLive(m)?'go':''}" onclick="event.stopPropagation();openRef('${m.id}')">${
    isOver(m)?'VIEW':isLive(m)?'RESUME':lineupReady(m)?'SCORE':'LINE-UPS'}</button>`;
  return `<div class="mrow" ${has?`onclick="openRef('${m.id}')"`:''}>
    <div class="mno"><span>${m.stage==='league'?'R'+m.round:m.stage==='final'?'FINAL':'BRONZE'}</span><span class="ctTag">${esc(courtName(m.c))}</span>
      ${odd?'<span class="oddsc" title="Not a finished game">⚠</span>':''}</div>
    <div class="side ${win?(win===m.a?'w':'l'):''}">${isLive(m)?'<span class="liveDot">●</span>':''}${teamTag(A)}</div>
    ${box('a')}<div class="sep">–</div>${box('b')}
    <div class="side b ${win?(win===m.b?'w':'l'):''}">${teamTag(B)}</div>${btn}</div>`;
}
function vMatches(){
  let h=modeBar()+oddBanner()+exportBar('matches');
  for(let r=1;r<=ROUNDS;r++){
    const ms=LEAGUE().filter(m=>m.round===r).sort((x,y)=>x.c-y.c);
    h+=section('r'+r,'Round '+r,ms.filter(isOver).length,ms.length,()=>`<div class="card">${ms.map(matchRow).join('')}</div>`);
  }
  const fin=[matchById('mF'),matchById('mB')];
  h+=section('rf','Final & Bronze',fin.filter(isOver).length,2,()=>
    `<div class="card">${fin.map(matchRow).join('')}</div>${leagueDone()?'':`<p class="note">Filled in automatically once all ${LEAGUE().length} league matches are finished.</p>`}`);
  return h;
}

/* ---------- Stats ---------- */
function vStats(){
  const R=rallyStats(); let h='';
  if(!R.players.length) return `<div class="card ed" style="text-align:center"><div style="font-size:30px;opacity:.4">📊</div>
    <p class="note">No rally data yet. Stats are built from matches scored on the court console with line-ups declared.
    Matches typed in as a final score count in the table, not here.</p></div>`;
  const mvp=R.players.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate)[0];
  h+=`<p class="note">Every rally is credited to the two players on court. ${R.withLineups} of ${R.total} scored matches have line-up data.</p>
  <div class="mvp"><div class="eyebrow" style="color:var(--accentInk)">Most valuable player</div>
    <div class="mvpn" style="color:${tcol(mvp.team)}">${esc(mvp.p.name)}</div>
    <div class="mvpt"><span class="tdot" style="background:${mvp.team.hex}"></span>${esc(mvp.team.name)}</div>
    <div class="mvpstats"><div><b>${mvp.diff>0?'+':''}${mvp.diff}</b><span>rally +/-</span></div><div><b>${mvp.won}</b><span>points won</span></div>
      <div><b>${mvp.rate}%</b><span>win rate</span></div><div><b>${mvp.hold}%</b><span>held serve</span></div></div></div>`;
  const views=[['players','Players'],['pairs','Pairs'],['serve','Serving'],['clutch','Clutch']];
  h+=`<div class="chips">${views.map(v=>`<div class="chip ${S.statsView===v[0]?'on':''}" onclick="S.statsView='${v[0]}';quietSave();render()">${v[1]}</div>`).join('')}</div>`;
  const nm=o=>`<td class="l"><span class="tname"><span class="tdot" style="background:${o.team.hex}"></span><span>${esc(o.p?o.p.name:(pName(o.ids[0])+' & '+pName(o.ids[1])))}<small>${esc(o.team.name)}</small></span></span></td>`;
  const dc=d=>`<td class="${d>0?'pos':d<0?'neg':''}">${d>0?'+':''}${d}</td>`;
  const rk=i=>`<td><span class="rk ${i<3?'f':''}">${i+1}</span></td>`;
  const wrap=(head,rows,note)=>`<div class="card"><div class="tblWrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></div><p class="note">${note}</p>`;
  if(S.statsView==='pairs') h+=wrap('<th>#</th><th class="l">Partnership</th><th>Rallies</th><th>Won</th><th>Lost</th><th>+/-</th><th>Win%</th>',
    R.pairs.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate).slice(0,20).map((o,i)=>`<tr>${rk(i)}${nm(o)}<td>${o.rallies}</td><td><b>${o.won}</b></td><td>${o.lost}</td>${dc(o.diff)}<td>${o.rate}%</td></tr>`).join(''),
    'Every duo the rotation puts on court together, best partnerships first.');
  else if(S.statsView==='serve') h+=wrap('<th>#</th><th class="l">Player</th><th>Serves</th><th>Won</th><th>Hold%</th>',
    R.players.filter(o=>o.serves>0).sort((x,y)=>y.hold-x.hold||y.serves-x.serves).map((o,i)=>`<tr>${rk(i)}${nm(o)}<td>${o.serves}</td><td><b>${o.servePts}</b></td><td><b>${o.hold}%</b></td></tr>`).join(''),
    'Rallies won on their own serve.');
  else if(S.statsView==='clutch') h+=wrap('<th>#</th><th class="l">Player</th><th>Rallies</th><th>Won</th><th>Lost</th><th>+/-</th>',
    R.players.filter(o=>o.cw+o.cl>0).sort((x,y)=>y.cdiff-x.cdiff||y.cw-x.cw).map((o,i)=>`<tr>${rk(i)}${nm(o)}<td>${o.cw+o.cl}</td><td><b>${o.cw}</b></td><td>${o.cl}</td>${dc(o.cdiff)}</tr>`).join(''),
    'Only rallies played once a team reached '+CLUTCH_FROM+' — the closing stretch.');
  else h+=wrap('<th>#</th><th class="l">Player</th><th>M</th><th>Rallies</th><th>Won</th><th>Lost</th><th>+/-</th><th>Win%</th>',
    R.players.slice().sort((x,y)=>y.diff-x.diff||y.rate-x.rate).map((o,i)=>`<tr>${rk(i)}${nm(o)}<td>${o.played}</td><td>${o.rallies}</td><td><b>${o.won}</b></td><td>${o.lost}</td>${dc(o.diff)}<td>${o.rate}%</td></tr>`).join(''),
    'M = matches. A rally counts for both players on court when it is won or lost.');
  return h;
}

function vRules(){
  let seq=''; for(let g=0;g<SQUAD;g++) seq+=`<div class="seqitem"><b>${g===0?0:g*GATE+1}–${(g+1)*GATE}</b> · A${g+1} + A${(g+1)%SQUAD+1}</div>`;
  return `<div class="card ed">
  <div class="rule-block"><h3>📋 Match format</h3><ul>
    <li>${S.teams.length} teams. <b>Each team plays ${SCHEDULE.length} matches.</b></li>
    <li><b>Top 2</b> teams qualify for the <b>Final</b> 🏆 · <b>3rd & 4th</b> play for the <b>Bronze medal</b> 🥉</li>
    <li>Teams are ranked on <b>total points scored</b>, then point difference, then wins.</li>
    <li>Matches use <b>rally scoring</b> — every rally scores. <b>First team to ${TARGET} wins.</b></li>
    <li>At <b>${GOLDEN}–${GOLDEN}</b> the match is decided by a <b>Golden Point</b>.</li>
    ${SWITCH_AT?`<li>Teams <b>change ends</b> when one team reaches <b>${SWITCH_AT}</b>.</li>`:''}</ul></div>
  <div class="rule-block"><h3>🔄 Player rotation</h3><ul>
    <li>Before the match each team declares its order <b>A1–A6</b> and hands it to the opposing captain.</li>
    <li>⚠️ Once submitted, <b>the order cannot be changed</b> during the match.</li>
    <li>A substitution happens when the <b>combined score</b> reaches ${[1,2,3,4,5,6].map(k=>k*GATE).join(', ')} (if required).</li>
    <li>The pair moves one slot down the order each time. After A6 + A1 the rotation restarts from <b>A1 + A2</b> at ${SQUAD*GATE+1}.</li></ul>
    <div class="seq">${seq}<div class="seqitem"><b>${SQUAD*GATE+1}+</b> · A1 + A2 again</div></div></div>
  <div class="rule-block"><h3>🏓 Serving and sides</h3><ul>
    <li>The toss winner serves first, from the <b>right</b>.</li>
    <li>The server serves from the <b>right when their team's score is even</b> and the <b>left when it is odd</b>.</li>
    <li>If the serving team wins the rally, its two players <b>swap sides</b> and the same player serves again.</li>
    <li>If the receiving team wins, the serve crosses and <b>nobody swaps</b> — whoever stands in the correct box serves.</li>
    <li>A substitute always takes the box of the player they replace.</li></ul></div>
  <div class="rule-block" style="margin:0"><h3>📍 Venue</h3><ul>
    <li>${esc(S.meta.sub)}</li><li>Courts: ${S.courts.map(esc).join(', ')}</li></ul></div></div>`;
}

function cbox(m,t,pos,cs,c,locked){
  const lu=m.lineup[t.id], idx=cs.slot[t.id][pos], pid=lu[idx], key=(t.id===m.a)?'a':'b';
  const isServer=(cs.serving===key)&&(servingBox(cs,key)===pos)&&!isOver(m);

    ${isServer?`<div class="servetag">serving from the ${pos==='R'?'right':'left'}</div>`:''}</div>`;
}
function consoleHTML(m){

  <div class="endsnote"><span>${ends?`⇄ Ends changed at ${SWITCH_AT} — ${esc(leftT.name)} now on the left`:SWITCH_AT?`Ends change when a team reaches ${SWITCH_AT}`:''}</span>
    <button class="btn sm ${S.inv[m.id]?'acc':''}" onclick="refSet('invert')">⇄ ${S.inv[m.id]?'View flipped':'Flip my view'}</button></div>`;
  if(!ro){
    h+=`<div class="ctrls">${[leftT,rightT].map(t=>`<div class="ctrlrow">

  } else if(pend){

        <div class="subswap"><span class="off"><span class="tag">OFF</span> A${sub.leave+1} ${esc(pName(lu[sub.leave]))}</span><span>→</span>
        <span class="on"><span class="tag">ON</span> A${sub.enter+1} ${esc(pName(lu[sub.enter]))} <b>(${side})</b></span></div></div>`; };
    h+=`<div class="submodal"><div class="subcard"><div class="subgate">Substitution · combined ${c}</div>
      <div class="subpair">Court is now ${pairLabel(c)}</div>${rowFor(A)}${rowFor(B)}
      ${ro?'<div class="subnote">Waiting for the referee to confirm.</div>':`<button class="bigok" onclick="ackSub(${c})">✓ Substitution done — resume play</button>

  }

}
function curRef(){ const m=S.ref&&matchById(S.ref); return (m&&canScore())?m:null; }
function addPoint(side){
  const m=curRef(); if(!m||!lineupReady(m)||isOver(m)||subPending(m)||endsPending(m)) return;
  if(!hasLog(m)&&m.fs){ if(!confirm('This match has a typed score. Scoring live replaces it. Continue?')) return; m.fs=null; }
  m.log=(m.log||[]).concat([side]); pruneAcks(m); S.luEdit=null; save(); renderRef();
  if(isOver(m)) toast(teamById(winnerOf(m)).name+' win!');
}
function refMinus(side){ const m=curRef(); if(!m) return;
  for(let i=m.log.length-1;i>=0;i--){ if(m.log[i]===side){ m.log.splice(i,1); break; } }
  pruneAcks(m); save(); renderRef(); }
function refUndo(){ const m=curRef(); if(!m||!hasLog(m)) return; m.log.pop(); pruneAcks(m); save(); renderRef(); }
function refClear(){ const m=curRef(); if(!m) return; if(!confirm('Reset this match to 0–0? Line-ups are kept.')) return;
  m.log=[]; m.acked=[]; m.endsAcked=false; save(); renderRef(); }
function refSet(what,arg){
  if(what==='invert'){ S.inv[S.ref]=!S.inv[S.ref]; quietSave(); renderRef(); return; }
  const m=curRef(); if(!m||hasLog(m)) return;
  if(what==='server') m.server=arg;
  if(what==='sides') m.startLeft=((m.startLeft||m.a)===m.a)?m.b:m.a;
  if(what==='flip'){ m.flip=m.flip||{}; m.flip[arg]=!m.flip[arg]; }
  save(); renderRef();
}
function ackSub(g){ const m=curRef(); if(!m) return; m.acked=(m.acked||[]).concat([g]); save(); renderRef(); }
function ackEnds(){ const m=curRef(); if(!m) return; m.endsAcked=true; save(); renderRef(); }

/* ===================== typed final scores ===================== */
function grabFocus(){ const a=document.activeElement; if(!a||!a.classList||!a.classList.contains('sc')) return null;
  let s=null,e=null; try{s=a.selectionStart;e=a.selectionEnd;}catch(x){} return {k:a.dataset.k,s,e}; }
function putFocus(f){ if(!f) return; const el=document.querySelector('input.sc[data-k="'+f.k+'"]'); if(!el||el.disabled) return;
  el.focus(); if(f.s!=null){ try{el.setSelectionRange(f.s,f.e);}catch(x){} } }
/* Typing a score must never rebuild the page. Rebuilding swaps the box being
   typed in for a fresh copy, and on phones the keyboard loses whatever comes
   next — type 15, get 1. So each keystroke only saves the number and touches
   up the row it belongs to; the page is redrawn once, after focus has left
   every score box. Moving between boxes with Tab or Enter never redraws. */
let scoreDirty=false, scoreRenderT=null;
function scoreInput(el){
  if(!canScore()) return;
  const [id,side]=el.dataset.k.split(':'), m=matchById(id); if(!m||hasLog(m)) return;
  const raw=el.value.replace(/[^0-9]/g,'');
  if(raw!==el.value) el.value=raw;
  let v=raw===''?null:parseInt(raw,10);
  if(v!=null&&v>TARGET){ v=TARGET; el.value=String(TARGET); }
  m.fs=m.fs||{a:null,b:null};
  if(m.fs[side]!==v){ m.fs[side]=v; if(m.fs.a==null&&m.fs.b==null) m.fs=null; save(); }
  const sec=el.closest&&el.closest('[data-sec]'); if(sec){ S.fold[sec.dataset.sec]=true; }
  scoreDirty=true; paintScoreRow(m);
}
function paintScoreRow(m){
  const odd=oddScore(m), win=winnerOf(m);
  ['a','b'].forEach(sd=>{ const box=document.querySelector('input.sc[data-k="'+m.id+':'+sd+'"]'); if(!box) return;
    box.classList.toggle('filled',box.value!==''); box.classList.toggle('odd',odd); });
  const any=document.querySelector('input.sc[data-k="'+m.id+':a"]'), row=any&&any.closest('.mrow'); if(!row) return;
  const sides=row.querySelectorAll('.side');
  if(sides[0]){ sides[0].classList.toggle('w',!!win&&win===m.a); sides[0].classList.toggle('l',!!win&&win!==m.a); }
  if(sides[1]){ sides[1].classList.toggle('w',!!win&&win===m.b); sides[1].classList.toggle('l',!!win&&win!==m.b); }
}
function flushScoreRender(){ clearTimeout(scoreRenderT);
  scoreRenderT=setTimeout(()=>{ if(document.querySelector('input.sc:focus')) return;
    if(!scoreDirty) return; scoreDirty=false; if(!modalOpen) render(); },350); }
document.addEventListener('focusout',e=>{
  const a=e.target; if(!a||!a.classList||!a.classList.contains('sc')) return;
  const to=e.relatedTarget; if(to&&to.classList&&to.classList.contains('sc')) return;
  flushScoreRender();
});
function scoreCheck(el){ const m=matchById(el.dataset.k.split(':')[0]); if(m&&oddScore(m)) toast('⚠ '+m.fs.a+'–'+m.fs.b+' is not a finished game to '+TARGET+' — check it'); }
document.addEventListener('keydown',e=>{

  if(kind==='host'&&!o.name) o.name=ORGANISER; brandChanged('Saved'); }

function clearBrandLogo(kind,id){ if(!isAdmin()) return; const o=findBrand(kind,id); if(!o||!confirm('Remove this logo?')) return; o.logo=''; o.invert=false; brandChanged('Logo removed'); }
function removeBrand(kind,id){ if(!isAdmin()||kind==='host') return; const o=findBrand(kind,id); if(!o||!confirm('Remove '+(o.name||'this entry')+'?')) return;
  const list=brandList(kind).filter(x=>x.id!==id); if(kind==='organisers') S.organisers=list; else S.sponsors=list; brandChanged('Removed'); }
function moveBrand(kind,id,dir){ if(!isAdmin()) return; const list=brandList(kind).slice(), i=list.findIndex(o=>o.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return; const t=list[i]; list[i]=list[j]; list[j]=t;
  if(kind==='organisers') S.organisers=list; else S.sponsors=list; brandChanged(); }
const LOGO_BUDGET=120000;
function pickLogo(kind,id,el){ const f=el.files&&el.files[0]; el.value=''; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('That is not an image file');
  readLogo(f).then(url=>{ const o=findBrand(kind,id); if(!o) return; o.logo=url; o.invert=false; brandChanged('Logo added'); }).catch(e=>toast(String(e.message||e))); }
function readLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error('That file could not be read'));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error('That image could not be opened'));
      img.onload=()=>{ const draw=(mw,mh,type,q)=>{ const s=Math.min(1,mw/img.width,mh/img.height), cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*s)); cv.height=Math.max(1,Math.round(img.height*s));
          const cx=cv.getContext('2d'); cx.imageSmoothingQuality='high';
          if(type==='image/jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);}
          cx.drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL(type,q); };
        let url=draw(440,180,'image/png'); if(url.length>LOGO_BUDGET) url=draw(300,120,'image/png');
        if(url.length>LOGO_BUDGET) url=draw(440,180,'image/jpeg',.86);
        if(url.length>LOGO_BUDGET) return rej(new Error('That image is too detailed to store — try a simpler logo'));
        res(url); };
      img.src=fr.result; };
    fr.readAsDataURL(file); });
}

function setupPreview(){

async function downloadBranded(){
  if(!isAdmin()) return toast('Admin only');
  const t=(S.meta.title||'')+(S.meta.sub?' · '+S.meta.sub:''), q=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  try{
    const res=await fetch(location.origin+location.pathname,{cache:'reload'}); if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text(); if(html.indexOf('<title>')<0) throw new Error('not the app file');
    html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>'+q(t)+'</title>');
    const meta=(a,n,v)=>{ html=html.replace(new RegExp('(<meta '+a+'="'+n+'" content=")[^"]*(")'),'$1'+q(v)+'$2'); };
    meta('property','og:title',t); meta('name','twitter:title',t); meta('property','og:site_name',hostName());
    meta('name','description','Live scores — '+t+' · '+hostName());
    const e1=v=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html=html.replace(/const EVENT_TITLE = '[^']*';/,"const EVENT_TITLE = '"+e1(S.meta.title)+"';");
    html=html.replace(/const EVENT_SUB   = '[^']*';/,"const EVENT_SUB   = '"+e1(S.meta.sub)+"';");
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='index.html'; a.click();
    toast('Downloaded — upload this as index.html');
  }catch(e){ toast('Could not read the file here — open it from its web address first'); }
}

function scopeMatches(scope){

}
const scoresIn=scope=>scopeMatches(scope).filter(m=>started(m)||Object.keys(m.lineup||{}).length).length;

function resultsText(scope){
  let t=`*${S.meta.title}*\n${S.meta.sub}\n`;
  const ch=champions();
  if(ch.gold) t+=`\n🏆 *Champions:* ${ch.gold.name}\n🥈 ${ch.silver?ch.silver.name:''}\n${ch.bronze?'🥉 '+ch.bronze.name+'\n':''}`;
  if(scope==='all'||scope==='table'){
    t+=`\n*STANDINGS* _(points scored)_\n`;
    standings().forEach(r=>{ t+=`${r.rank}. ${r.team.name} — ${r.pf} pts (${r.diff>0?'+':''}${r.diff}) · ${r.w}W ${r.l}L${r.rank<=2?' 🏆':r.rank<=4?' 🥉':''}\n`; });
    t+=`_${leaguePlayed()} of ${LEAGUE().length} league matches played_\n`;
  }
  if(scope==='all'){
    for(let r=1;r<=ROUNDS;r++){ const ms=LEAGUE().filter(m=>m.round===r&&counts(m)); if(!ms.length) continue;
      t+=`\n*ROUND ${r}*\n`; ms.forEach(m=>{ const s=scoreOf(m); t+=`${teamById(m.a).name} ${s.a}-${s.b} ${teamById(m.b).name}\n`; }); }
  }
  if(scope==='all'||scope==='finals'){
    [matchById('mF'),matchById('mB')].forEach(m=>{ if(!m.a) return; const s=scoreOf(m);
      t+=`\n*${m.stage==='final'?'FINAL':'BRONZE MATCH'}*\n${teamById(m.a).name} ${counts(m)?s.a+'-'+s.b:'vs'} ${teamById(m.b).name}\n`; });
  }
  const org=organiserLine(), ev=eventPhone(), hp=hostPhone();
  if(org) t+=`\nOrganised by *${org}*`+(ev?' · '+ev:'');
  const sp=shownSponsors().map(o=>o.name).filter(Boolean); if(sp.length) t+=`\n_Sponsors: ${sp.join(' · ')}_`;
  t+=`\nHosted on *${hostName()}*`+(hp?`\n_To run your own tournament here: ${hp}_`:'');
  return t.replace(/\n{3,}/g,'\n\n');
}

const IMG_W=1200, IMG_PAD=48, LOGO_IMG_H=68, IMG_MAX_PX=16000000;

    const q=base+(sync.noFilter?'':'&key=like.'+encodeURIComponent(sync.event+':')+'*')+(since?'&updated_at=gt.'+encodeURIComponent(since):'');
    let rows; try{ rows=await supa(q); }catch(err){ if(!sync.noFilter&&/HTTP 4/.test(String(err.message||err))){ sync.noFilter=true;
      rows=await supa(base+(since?'&updated_at=gt.'+encodeURIComponent(since):'')); } else throw err; }
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{
      if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at;
      if(sync.dirty[r.key]) return;
      const kind=rowKind(r.key), remote=JSON.stringify(r.data);
      if(kind==='cfg'){ if(applyRow(r.key,r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remote; changed++; } return; }
      if(r.rev<(sync.rev[r.key]||0)) return;
      if(sync.sent[r.key]===remote){ sync.rev[r.key]=r.rev; return; }
      if(applyRow(r.key,r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remote; changed++; }
    });
    sync.cursor=newest;
    if(changed){ refresh(); quietSave(); const snap=syncSnapshot(); Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); }); }
    sync.lastOk=Date.now(); syncSave(); syncStatus('live'); syncLog(changed?'received '+changed+' change'+(changed>1?'s':''):'checked · nothing new');
    if(changed){ if(S.ref) renderRef(); if(document.querySelector('input.sc:focus')) scoreDirty=true; else if(!modalOpen) render(); }
  }catch(e){ syncLog('pull failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.pulling=false; }
}
function syncStart(){ sync.on=true; syncSave(); syncStatus('sync'); clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS); syncPull(true).then(()=>syncScan()); }
function syncStop(){ sync.on=false; clearInterval(pullTimer); pullTimer=null; clearTimeout(pushTimer); syncSave(); syncStatus('off'); }
async function drainQueue(rounds){ rounds=rounds||8;
  for(let i=0;i<rounds&&sync.on&&Object.keys(sync.dirty).length;i++){ await syncPush(); if(!Object.keys(sync.dirty).length) break; await new Promise(r=>setTimeout(r,150)); }
  return Object.keys(sync.dirty).length; }
async function syncPublishAll(){
  if(!sync.on) return toast('Turn live sync on first'); if(!canScore()) return toast('Unlock scoring first');
  const snap=syncSnapshot(); Object.keys(snap).forEach(k=>{ const kind=rowKind(k);
    if((ADMIN_ROWS.indexOf(kind)>=0&&!isAdmin())||(kind==='team'&&!canEditTeams())) return;
    sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length; toast('Publishing '+sync.pending+' rows…');
  const left=await drainQueue(12); toast(left?'Still '+left+' waiting — no connection':'Published'); if(modalOpen) openModal(syncModal()); }
const syncAlertCls=()=>sync.status==='live'?'ok':(sync.status==='off'?'warn':'bad');
function syncAlertHTML(){ const ago=sync.lastOk?Math.round((Date.now()-sync.lastOk)/1000)+'s ago':'never';
  return '<span>'+(sync.status==='live'?'●':sync.status==='off'?'○':'⚠')+'</span><span><b>'+({off:'Sync is off — this device only',sync:'Connecting…',live:'Live',off_line:'No connection',error:'Sync error'}[sync.status]||'')+'</b>'+
    (sync.on?'<br>Last exchange '+esc(ago)+(sync.pending?' · '+sync.pending+' waiting to send':''):'')+(sync.note?'<br><span style="font-weight:400;font-size:11px">'+esc(sync.note)+'</span>':'')+'</span>'; }
function syncModal(){
  return `<h3>Live sync</h3><p class="hint" style="margin-bottom:12px">On by default — open the link on any phone and it follows the live results. Scoring keeps working with no signal; changes queue and go out when the connection returns.</p>
    <div class="alert ${syncAlertCls()}" id="syncstat">${syncAlertHTML()}</div>
    <label class="fl">This device</label><input type="text" value="${attr(sync.device)}" placeholder="Court 10 · Ravi" onchange="sync.device=this.value.trim()||sync.device;syncSave()">
    <p class="hint">Tagged on every change this device makes.</p>
    <label class="fl">Event code</label><input type="text" value="${attr(sync.event)}" onchange="changeEvent(this.value)">
    <p class="hint">All devices must share the same code.</p>
    <div class="eyebrow" style="margin:16px 2px 5px">Activity</div>
    <div class="card" style="font-size:11px;line-height:1.8;color:var(--muted);padding:10px 12px">${sync.log.length?sync.log.map(esc).join('<br>'):'Nothing yet.'}</div>
    <div class="row" style="margin:14px 0">${sync.on?'<button class="btn" onclick="syncStop();openModal(syncModal())">Turn sync off</button>':'<button class="btn acc" onclick="syncStart();openModal(syncModal())">Turn sync on</button>'}
      <button class="btn sm" onclick="syncPull(true)">Check now</button>${canScore()?'<button class="btn sm" onclick="syncPublishAll()">Re-send everything</button>':''}</div>
    <div class="alert ok"><span>⟳</span><span><b>This device is running ${BUILD}</b><br>If a phone behaves differently from the others it may be on an older copy.
      <div class="row" style="margin-top:8px"><button class="btn sm" onclick="location.replace(location.origin+location.pathname+'?v='+Date.now())">Get the latest version</button></div></span></div>
    <button class="btn acc" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;
}
function changeEvent(v){ v=(v||'').trim()||'ptme2'; if(v===sync.event) return;
  sync.event=v; sync.cursor=null; sync.rev={}; sync.sent={}; sync.dirty={}; syncBaseline(); if(sync.on) syncStart(); toast('Event set to '+v); }

/* ===================== not losing the page by accident ===================== */
let backArmed=false,backTimer=null;
function guardHistory(){
  try{ history.pushState({pt:1},'',location.href); }catch(e){ return; }
  window.addEventListener('popstate',()=>{ const re=()=>{ try{history.pushState({pt:1},'',location.href);}catch(e){} };
    if(S.ref){ re(); refBack(); return; } if(modalOpen){ re(); closeModal(); return; }
    if(S.tab!==TABS()[0][0]){ re(); go(TABS()[0][0]); return; }
    if(canScore()&&!backArmed){ backArmed=true; re(); toast('Press back again to leave — every score is already saved');
      clearTimeout(backTimer); backTimer=setTimeout(()=>{backArmed=false;},2600); } });
}
window.addEventListener('beforeunload',e=>{ const q=Object.keys(sync.dirty||{}).length;
  if(canScore()&&(S.ref||q)){ e.preventDefault(); e.returnValue=''; return ''; } });
window.addEventListener('pagehide',quietSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') quietSave(); else if(sync.on) syncPull(false); });

/* ===================== start ===================== */
let S=load();
applyTheme(); applyRules(); guardHistory(); syncLoad();
if(!Object.keys(sync.sent).length) syncBaseline();
render();
if(sync.on){ syncStatus('sync'); pullTimer=setInterval(()=>syncPull(false),PULL_MS); syncPull(true).then(()=>syncScan()); }
else syncStatus('off');
</script>
</body>
